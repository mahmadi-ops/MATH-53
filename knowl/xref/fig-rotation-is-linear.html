<figcaption><span class="type">Figure</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">3.11<span class="period heading-divison-mark heading-divison-mark__period">.</span></span><span class="space heading-divison-mark heading-divison-mark__space"> </span>A rotation is a linear transformation. Rotating the plane carries the parallelogram on <span class="process-math">\(\vec{u}\)</span> and <span class="process-math">\(\vec{v}\)</span> to the parallelogram on <span class="process-math">\(R_\theta(\vec{u})\)</span> and <span class="process-math">\(R_\theta(\vec{v})\text{,}\)</span> so the rotated diagonal <span class="process-math">\(R_\theta(\vec{u} + \vec{v})\)</span> is the diagonal <span class="process-math">\(R_\theta(\vec{u}) + R_\theta(\vec{v})\)</span> of the new parallelogram. A rotation also carries a line through the origin to a line through the origin and does not change lengths, so <span class="process-math">\(R_\theta(a\vec{u}) = aR_\theta(\vec{u})\)</span> for every scalar <span class="process-math">\(a\text{.}\)</span><div class="autopermalink" aria-hidden="true" data-description="Figure 3.11"><a tabindex="-1" href="#fig-rotation-is-linear" title="Copy heading and permalink for Figure 3.11" aria-label="Copy heading and permalink for Figure 3.11">🔗</a></div></figcaption>
