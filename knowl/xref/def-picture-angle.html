<article class="definition definition-like"><h2 class="heading">
<span class="type">Definition</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">7.65</span><span class="period heading-divison-mark heading-divison-mark__period">.</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="title">The Angle Between Two Pictures.</span>
</h2>
<div class="para logical">
<div class="para">For nonzero pictures <span class="process-math">\(X\)</span> and <span class="process-math">\(Y\)</span> in <span class="process-math">\(\mathbb{M}_{mn}\text{,}\)</span> the <dfn class="terminology">angle</dfn> between them is the unique <span class="process-math">\(\theta \in [0, \pi]\)</span> with</div>
<div class="displaymath process-math">
\begin{equation*}
\cos\theta = \frac{X \cdot Y}{\| X \| \, \| Y \|}.
\end{equation*}
</div>
